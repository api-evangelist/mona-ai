description: >-
  Mona AI GmbH (mona-ai.de) is a German AI recruiting-automation company backed
  by Earlybird. Its platform combines AI agents and digital avatars to automate
  recruiting and HR processes for staffing agencies and enterprises: 24/7
  candidate outreach, automated pre-qualification and candidate-profile
  generation, and "digital branch" structures — built to be fully GDPR- and
  EU-AI-Act-compliant. Products include MONA Recruiting, MONA Recruiting Light,
  MONA Agents, MONA Digital Branch, MONA Consulting and MONA ARS, an autonomous
  prompt-driven recruiting system that sources, screens, schedules and reports
  automatically. The website is Wix-hosted and exposes a Wix Site MCP endpoint
  plus an llms.txt for AI-agent access; the recruiting product itself runs
  behind a login and does not publish a public developer API, SDK or OpenAPI.
